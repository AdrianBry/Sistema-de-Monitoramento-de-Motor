<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema ESP32</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="dashboard">

        <!-- TOPBAR -->
        <div class="topbar">
            <div class="status">
                <span class="green-dot"></span>
                Status: <span class="green">Operacional</span>
            </div>
            <div class="date" id="dateNow">Data: --</div>
            <div class="port">
                Porta:
                <span class="green">Servidor Conectado</span>
            </div>
        </div>

        <!-- TITLE -->
        <div class="titlebar">
            <div class="logo-area">⚡</div>
            <h1>SISTEMA DE MONITORAMENTO DE MOTOR</h1>
        </div>

        <!-- CARDS -->
        <div class="cards-grid">
            <!-- TEMP -->
            <div class="card">
                <div class="card-title">TEMPERATURA DO MOTOR</div>
                <div class="big-number" id="motor">0°C</div>
                <div class="gauge-wrapper">
                    <div class="gauge gauge-temp">
                        <div class="needle" id="tempNeedle"></div>
                    </div>
                </div>
                <div class="status-text">
                    Status:<span id="statusMotor" class="orange">MÉDIA</span>
                </div>

            </div>

            <!-- RPM -->
            <div class="card">
                <div class="card-title">RPM DO MOTOR</div>
                <div class="big-number" id="rpm">0000 RPM</div>
                <div class="gauge-wrapper">
                    <div class="gauge gauge-rpm">
                        <div class="needle" id="rpmNeedle"></div>
                    </div>
                </div>
                <div class="status-text">
                    Status: <span id="statusRPM" class="yellow">NORMAL</span>
                </div>
            </div>

            <!-- PWM -->
            <div class="card">
                <div class="card-title">PWM (VOLTS)</div>
                <div class="big-number" id="voltage">0.00 V</div>
                <div class="pwm-box">
                    <div class="bar-bg">
                        <div class="bar-fill" id="pwmBar"></div>
                    </div>
                    <div class="duty-text">
                        Duty Cycle:<span id="duty">0%</span>
                    </div>
                </div>
            </div>

            <!-- FAN -->
            <div class="card">
                <div class="card-title">STATUS DA VENTOINHA DE RESFRIAMENTO</div>
                <div class="fan-area">
                    <div class="fan" id="fan"></div>
                    <div class="fan-status">
                        Fan:
                        <span class="green" id="fanStatus">DESLIGADA</span>
                    </div>
                    <div class="fan-speed">
                        Intensidade:<span id="fanIntensity">0%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- GRAPH -->
        <div class="graph-container">
            <div class="graph-header">
                <h2>TEMPERATURA DO MOTOR</h2>
                <div class="buttons"></div>
            </div>
            <canvas id="grafico"></canvas>
        </div>
    </div>

    <script>

        const ws = new WebSocket('wss://reposit-rio.onrender.com');
        const chart = new Chart(document.getElementById('grafico'), { type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Temperatura',
                    data: [],
                    borderColor: '#ff9f43',
                    backgroundColor: '#ff9f43',
                    tension: 0.3
                }]
            },

            options: {
                responsive: true, plugins: {
                    legend: {labels: 
                        { color: '#ffffff'}
                    }
                },

                scales: {
                    x: {
                        ticks: {color: '#ffffff'},
                        grid: {color: '#2d3748'}
                    },
                    y: {
                        ticks: {color: '#ffffff'}, 
                            grid: {color: '#2d3748'
                        }
                    }
                }
            }
        });

        function atualizarRelogio() {
            const agora = new Date();
            document.getElementById("dateNow").innerHTML = `Data: ${agora.toLocaleDateString()} ${agora.toLocaleTimeString()}`;
        }

        setInterval(atualizarRelogio, 1000);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);


            // TEMPERATURA
            document.getElementById("motor").innerHTML = `${data.temp_motor} °C`;
            let anguloTemp = (data.temp_motor / 120) * 180;
            document.getElementById("tempNeedle").style.transform = `rotate(${anguloTemp - 90}deg)`;


            // STATUS TEMPERATURA
            let statusMotor = "FRIO";
            if(data.temp_motor >= 90 && data.temp_motor < 105) {
                statusMotor = "IDEAL";
            }

            if(data.temp_motor >= 105) {
                statusMotor = "ALTA";
            }

            if(data.temp_motor >= 110) {
                statusMotor = "CRÍTICA";
            }
            document.getElementById("statusMotor").innerHTML = statusMotor;


            // RPM
            document.getElementById("rpm").innerHTML = `${data.rpm} RPM`;
            let anguloRPM = (data.rpm / 8000) * 180;
            document.getElementById("rpmNeedle").style.transform = `rotate(${anguloRPM - 90}deg)`;


            // PWM
            const intensidade = data.ventoinha || 0;
            const tensao = (intensidade / 100 * 3.3).toFixed(2);

            document.getElementById("voltage").innerHTML = `${tensao} V`;

            document.getElementById("duty").innerHTML = `${intensidade.toFixed(0)}%`;

            document.getElementById("pwmBar").style.height = `${intensidade}%`;


            // FAN
            const fan = document.getElementById("fan");
            fan.style.animationDuration = `${1 - intensidade / 120}s`;

            document.getElementById("fanIntensity").innerHTML = `${intensidade.toFixed(0)}%`;

            if(intensidade > 0) {
                document.getElementById("fanStatus").innerHTML = "LIGADA";
            } else {
                document.getElementById("fanStatus").innerHTML = "DESLIGADA";
            }

            // CHART
            chart.data.labels = [...data.time_array];
            chart.data.datasets[0].data = [...data.temp_motor_array];
            chart.update();
        };
    </script>
</body>
</html>
